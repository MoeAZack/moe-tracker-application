name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
  windows-lifecycle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Validate capture and complete product journeys
        shell: pwsh
        run: |
          npm run test:scrim-capture
          npx vitest run tests/coachingHttp.test.ts tests/replayReviewWorkflow.test.ts tests/replayScreenshotPairing.test.ts tests/desktopSyncOutbox.test.ts tests/desktopSessionSecurity.test.ts
      - run: npm run build
