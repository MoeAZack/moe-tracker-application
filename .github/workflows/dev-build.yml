name: Dev build (unsigned)

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-deps:
    # Offline dev sandboxes cannot reach npm or artifact storage, but can
    # fetch git refs. Publish a trimmed node_modules snapshot to a temporary
    # orphan branch (deleted after use) so tests and OCR backtests run there.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Push trimmed node_modules snapshot to ci/deps-snapshot
        shell: bash
        run: |
          rm -rf node_modules/electron/dist node_modules/app-builder-bin node_modules/7zip-bin node_modules/.cache
          mkdir -p /tmp/snap && tar -czf /tmp/snap/nm.tgz node_modules
          cd /tmp/snap && split -b 45m nm.tgz nm.tgz.part- && rm nm.tgz && sha256sum nm.tgz.part-* > SHA256SUMS
          git init -q -b ci/deps-snapshot && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "deps snapshot for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci/deps-snapshot

  replay-toolchain:
    # Linux build of the same pinned vrfkit commit plus a pyarrow wheel, for
    # offline replay backtests in sandboxes without crates.io/PyPI access.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: yakisoba0728/vrfkit
          ref: c4d6cc0e5ec3904fdb64b350b2656b8e3ff33d53
          path: vrfkit
      - uses: dtolnay/rust-toolchain@stable
      - name: Build vrfkit (Linux) and fetch pyarrow wheel
        shell: bash
        run: |
          cd vrfkit && cargo build --release --locked -p vrfkit && cd ..
          mkdir -p /tmp/tool && cp vrfkit/target/release/vrfkit /tmp/tool/vrfkit-linux
          python3 -m pip download --only-binary=:all: --no-deps --python-version 3.13 --platform manylinux2014_x86_64 -d /tmp/tool 'pyarrow==18.1.0'
          cd /tmp/tool && sha256sum * > SHA256SUMS && cat SHA256SUMS
          git init -q -b ci/replay-toolchain && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "vrfkit c4d6cc0 linux + pyarrow"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci/replay-toolchain

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  windows-installer:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture helper checks (Windows PowerShell 5.1)
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\windows\timeline-tiles.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:scrim-capture
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bundle pinned replay parser runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $rt = Join-Path $PWD 'replay-runtime'
          New-Item -ItemType Directory -Force (Join-Path $rt 'vrfkit'), (Join-Path $rt 'python') | Out-Null
          $zip = Join-Path $env:RUNNER_TEMP 'vrfkit.zip'
          Invoke-WebRequest 'https://github.com/yakisoba0728/vrfkit/releases/download/v0.2.5/vrfkit-v0.2.5-windows-x64.zip' -OutFile $zip
          $zipHash = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($zipHash -ne '2cf8375191f7de8b8199f84a69e91a02e5e4d5b541c242e466c9d9aa24ef7494') { throw "vrfkit release ZIP hash mismatch: $zipHash" }
          $extract = Join-Path $env:RUNNER_TEMP 'vrfkit'
          Expand-Archive $zip -DestinationPath $extract
          $exe = Get-ChildItem $extract -Recurse -Filter 'vrfkit.exe' | Select-Object -First 1
          $exeHash = (Get-FileHash $exe.FullName -Algorithm SHA256).Hash.ToLower()
          if ($exeHash -ne 'aa55fc410f1596a6ffedc7ab579341da6edb262197c64902e74b4eed485dc23f') { throw "vrfkit.exe hash mismatch: $exeHash" }
          Copy-Item (Join-Path $exe.DirectoryName '*') (Join-Path $rt 'vrfkit') -Recurse
          $pyVersion = '3.12.10'
          $pyZip = Join-Path $env:RUNNER_TEMP 'python-embed.zip'
          Invoke-WebRequest "https://www.python.org/ftp/python/$pyVersion/python-$pyVersion-embed-amd64.zip" -OutFile $pyZip
          Write-Host "python embed sha256: $((Get-FileHash $pyZip -Algorithm SHA256).Hash.ToLower())"
          Expand-Archive $pyZip -DestinationPath (Join-Path $rt 'python')
          $pth = Get-ChildItem (Join-Path $rt 'python') -Filter 'python*._pth' | Select-Object -First 1
          Add-Content $pth.FullName "Lib\site-packages`nimport site"
          python -m pip install --only-binary=:all: --no-deps --target (Join-Path $rt 'python\Lib\site-packages') 'pyarrow==18.1.0'
          & (Join-Path $rt 'python\python.exe') -c "import pyarrow.parquet; print('pyarrow', pyarrow.__version__)"
          if ($LASTEXITCODE -ne 0) { throw 'Embedded Python cannot import pyarrow.' }
          & (Join-Path $rt 'vrfkit\vrfkit.exe') --version
      - name: Build unsigned installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run build
          npx electron-builder --win nsis --publish never
      - name: Hash installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem release\Moe-Tracker-Application-*-Setup.exe | Select-Object -First 1
          if (-not $installer) { throw 'Installer was not created.' }
          (Get-FileHash $installer.FullName -Algorithm SHA256).Hash | Out-File -Encoding ascii "$($installer.FullName).sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-installer
          path: |
            release/Moe-Tracker-Application-*-Setup.exe
            release/Moe-Tracker-Application-*-Setup.exe.sha256
            release/latest.yml
          retention-days: 7
