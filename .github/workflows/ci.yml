name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm audit --omit=dev --audit-level=high
  windows-lifecycle:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Validate capture and complete product journeys
        shell: pwsh
        run: |
          npm run test:scrim-capture
          npx vitest run tests/coachingHttp.test.ts tests/replayReviewWorkflow.test.ts tests/replayScreenshotPairing.test.ts tests/desktopSyncOutbox.test.ts tests/desktopSessionSecurity.test.ts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify bundled desktop runtime and IPC journeys
        shell: pwsh
        run: |
          .\scripts\stage-replay-runtime.ps1
          npm run verify:runtime:bundled
          npm run build
          $env:CSC_IDENTITY_AUTO_DISCOVERY='false'
          npx electron-builder --win --dir
          npm run test:desktop-ipc
