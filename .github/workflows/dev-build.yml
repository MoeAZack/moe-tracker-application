name: Dev build (unsigned)

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-deps:
    if: github.event_name == 'workflow_dispatch'
    # Offline dev sandboxes cannot reach npm or artifact storage, but can
    # fetch git refs. Publish a trimmed node_modules snapshot to a temporary
    # orphan branch (deleted after use) so tests and OCR backtests run there.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Push trimmed node_modules snapshot to ci/deps-snapshot
        shell: bash
        run: |
          rm -rf node_modules/electron/dist node_modules/app-builder-bin node_modules/7zip-bin node_modules/.cache
          mkdir -p /tmp/snap && tar -czf /tmp/snap/nm.tgz node_modules
          cd /tmp/snap && split -b 45m nm.tgz nm.tgz.part- && rm nm.tgz && sha256sum nm.tgz.part-* > SHA256SUMS
          git init -q -b ci/deps-snapshot && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "deps snapshot for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci/deps-snapshot

  replay-toolchain:
    if: github.event_name == 'workflow_dispatch'
    # Linux build of the same pinned vrfkit commit plus a pyarrow wheel, for
    # offline replay backtests in sandboxes without crates.io/PyPI access.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          repository: MoeAZack/vrfkit
          ref: 4bacfdc2b766caec02d830cc65f8c4e2ea9dc14c
          path: vrfkit
      - uses: dtolnay/rust-toolchain@stable
      - name: Build vrfkit (Linux) and fetch pyarrow wheel
        shell: bash
        run: |
          cd vrfkit && cargo build --release --locked -p vrfkit && cd ..
          mkdir -p /tmp/tool && cp vrfkit/target/release/vrfkit /tmp/tool/vrfkit-linux
          python3 -m pip download --only-binary=:all: --no-deps --python-version 3.13 --platform manylinux2014_x86_64 -d /tmp/tool 'pyarrow==18.1.0'
          cd /tmp/tool && sha256sum * > SHA256SUMS && cat SHA256SUMS
          git init -q -b ci/replay-toolchain && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "vrfkit 4bacfdc linux + pyarrow"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci/replay-toolchain

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - run: npm run check

  windows-installer:
    needs: verify
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.18.0
          cache: npm
      - run: npm ci
      - name: Capture helper checks (Windows PowerShell 5.1)
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\windows\timeline-tiles.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:scrim-capture
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Bundle pinned replay parser runtime
        shell: pwsh
        run: |
          .\scripts\stage-replay-runtime.ps1
          npm run verify:runtime:bundled
      - name: Build unsigned installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run build
          npx electron-builder --win nsis --publish never
      - name: Hash installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem release\Moe-Tracker-Application-*-Setup.exe | Select-Object -First 1
          if (-not $installer) { throw 'Installer was not created.' }
          (Get-FileHash $installer.FullName -Algorithm SHA256).Hash | Out-File -Encoding ascii "$($installer.FullName).sha256"
      - name: Publish encrypted installer parts to ci/dev-installer (offline delivery)
        # The repository is public, so only ciphertext is published: a random
        # AES-256 key encrypts the installer and is itself encrypted to the
        # delivery public key; the private key never leaves the delivery sandbox.
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'claude/deliver')
        shell: bash
        run: |
          set -e
          mkdir -p /tmp/inst && cd /tmp/inst
          src=$(ls "$GITHUB_WORKSPACE"/release/Moe-Tracker-Application-*-Setup.exe)
          exe=$(basename "$src")
          sha256sum "$src" | cut -d' ' -f1 > "$exe.sha256"
          openssl rand -out key.bin 32
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$src" -out "$exe.enc" -pass file:key.bin
          openssl pkeyutl -encrypt -pubin -inkey "$GITHUB_WORKSPACE/.github/delivery-public-key.pem" -pkeyopt rsa_padding_mode:oaep -in key.bin -out key.bin.rsa
          rm key.bin
          split -b 24m "$exe.enc" "$exe.enc.part-" && rm "$exe.enc" && sha256sum * > SHA256SUMS
          git init -q -b ci/dev-installer && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "unsigned dev installer for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci/dev-installer
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-installer
          path: |
            release/Moe-Tracker-Application-*-Setup.exe
            release/Moe-Tracker-Application-*-Setup.exe.sha256
            release/latest.yml
          retention-days: 7
