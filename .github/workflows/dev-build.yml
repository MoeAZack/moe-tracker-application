name: Dev build (unsigned)

on:
  push:
    branches: ['claude/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-deps:
    # Offline dev sandboxes cannot reach npm or artifact storage, but can
    # fetch git refs. Publish a trimmed node_modules snapshot to a temporary
    # orphan branch (deleted after use) so tests and OCR backtests run there.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Push trimmed node_modules snapshot to ci/deps-snapshot
        shell: bash
        run: |
          rm -rf node_modules/electron/dist node_modules/app-builder-bin node_modules/7zip-bin node_modules/.cache
          mkdir -p /tmp/snap && tar -czf /tmp/snap/nm.tgz node_modules
          cd /tmp/snap && split -b 45m nm.tgz nm.tgz.part- && rm nm.tgz && sha256sum nm.tgz.part-* > SHA256SUMS
          git init -q -b ci/deps-snapshot && git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -q -m "deps snapshot for ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" ci/deps-snapshot

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check

  windows-installer:
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Capture helper checks (Windows PowerShell 5.1)
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File tests\windows\timeline-tiles.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:scrim-capture
      - name: Build unsigned installer
        shell: pwsh
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          npm run build
          npx electron-builder --win nsis --publish never
      - name: Hash installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem release\Moe-Tracker-Application-*-Setup.exe | Select-Object -First 1
          if (-not $installer) { throw 'Installer was not created.' }
          (Get-FileHash $installer.FullName -Algorithm SHA256).Hash | Out-File -Encoding ascii "$($installer.FullName).sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-installer
          path: |
            release/Moe-Tracker-Application-*-Setup.exe
            release/Moe-Tracker-Application-*-Setup.exe.sha256
            release/latest.yml
          retention-days: 7
